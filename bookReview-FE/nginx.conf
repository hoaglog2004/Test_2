server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình Proxy: Chuyển mọi yêu cầu /api sang Backend
    location /api/ {
        proxy_pass http://spring_backend:8080; # Tên service trong docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}